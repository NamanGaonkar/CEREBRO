name: scoop-update

on:
  schedule:
    # Excavator: keeps bucket/cerebro.json in sync with the latest GitHub release
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  excavate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update bucket manifests
        uses: ScoopInstaller/GithubActions@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
